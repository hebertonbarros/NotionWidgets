<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Progress</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@400;500;600&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">

<style>
:root {
    --page: #e9e8e4;
    --card1: #fbfaf7;
    --card2: #efede8;
    --ink: #14182e;
    --sub: #5d6068;
    --track: #e6e5e2;
    --row: rgba(255,255,255,.85);
    --shadow: 0 6px 18px rgba(60,55,40,.10);
}

*, *::before, *::after {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
}

body {
    background: var(--page);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: 'DM Sans', sans-serif;
    color: var(--ink);
}

.card {
    position: relative;
    width: 100%;
    max-width: 900px;
    border-radius: 24px;
    overflow: hidden;
    background: radial-gradient(
        120% 90% at 30% 0%,
        var(--card1),
        var(--card2)
    );
    box-shadow:
        0 20px 50px rgba(0,0,0,.18),
        0 2px 6px rgba(0,0,0,.08);
    padding: 34px 36px 30px;
}

.inner {
    position: relative;
    z-index: 2;
}

/* BOTANICAL ILLUSTRATIONS */

svg.plants {
    position: absolute;
    pointer-events: none;
}

#p1 {
    top: 0;
    right: 0;
    width: 335px;
    height: 279px;
}

#p2 {
    bottom: -8px;
    right: 112px;
    width: 165px;
    height: 104px;
}

/* HEADER */

h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 500;
    font-size: 44px;
    margin: 0;
    letter-spacing: .2px;
    line-height: 1.2;
}

.date {
    margin: 10px 0 26px 4px;
    font-size: 13px;
    letter-spacing: .2em;
    color: #3b3e4a;
    text-transform: uppercase;
}

/* PROGRESS CARDS */

.row {
    display: grid;
    grid-template-columns: 44px 110px minmax(0,1fr) 72px;
    align-items: center;
    gap: 14px;

    background: var(--row);
    border-radius: 20px;
    padding: 14px 16px;
    margin-bottom: 14px;

    box-shadow: var(--shadow);
    backdrop-filter: blur(6px);
}

.ico {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: grid;
    place-items: center;
}

.ico svg {
    width: 27px;
    height: 27px;
}

.lbl b {
    display: block;
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 600;
    font-size: 18px;
    color: #1d2033;
}

.lbl span {
    font-size: 12px;
    color: var(--sub);
    white-space: nowrap;
}

.track {
    width: 100%;
    height: 22px;
    border-radius: 12px;
    background: var(--track);
    overflow: hidden;
}

.fill {
    height: 100%;
    width: 0;
    border-radius: 12px;
    transition: width .4s ease;
}

.pct {
    text-align: right;
    font-weight: 600;
    font-size: 22px;
    white-space: nowrap;
}

.pct small {
    font-size: 11px;
    font-weight: 500;
    color: #8a8d95;
}

/* DIVIDER */

hr {
    border: 0;
    border-top: 1px solid #cfcdc7;
    margin: 20px 4px 18px;
}

/* AGE */

.age {
    display: flex;
    align-items: center;
    gap: 16px;
    padding-left: 2px;
    padding-bottom: 12px;
}

.age-content {
    position: relative;
    min-width: 0;
}

.av {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: #dfe0d6;
    display: grid;
    place-items: center;
    flex: none;
}

.age small {
    display: block;
    font-size: 14px;
    color: #3b3e4a;
}

.age .v {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 25px;
    line-height: 1.2;
    margin-top: 5px;
}

.age .t {
    font-size: 11px;
    color: #8a8d95;
    margin-top: 5px;
    font-variant-numeric: tabular-nums;
}

.script {
    position: absolute;
    right: 30px;
    bottom: 34px;
    z-index: 2;
    font-family: 'Mrs Saint Delafield', cursive;
    font-size: 36px;
    line-height: .9;
    color: #5e6b82;
    transform: rotate(-6deg);
}

.script span {
    display: block;
}

.script span + span {
    margin-left: 30px;
}

/* ==========================================
   RESPONSIVE NOTION LAYOUT
   ========================================== */

@media (max-width: 650px) {

    body {
        padding: 8px;
        align-items: flex-start;
    }

    .card {
        padding: 22px 16px 24px;
        border-radius: 20px;
        box-shadow: 0 5px 18px rgba(0,0,0,.12);
    }

    h1 {
        font-size: clamp(25px, 7vw, 34px);
        position: relative;
        z-index: 3;
    }

    .date {
        font-size: 10px;
        letter-spacing: .12em;
        margin: 8px 0 20px 2px;
    }

    #p1 {
        width: 150px;
        height: 125px;
        top: -20px;
        right: -45px;
        opacity: .28;
    }

    #p2 {
        width: 110px;
        height: 75px;
        right: -10px;
        bottom: -10px;
        opacity: .45;
    }

    .row {
        grid-template-columns: 42px minmax(0,1fr) auto;
        grid-template-rows: auto auto;
        column-gap: 10px;
        row-gap: 12px;
        padding: 13px;
        margin-bottom: 12px;
        border-radius: 16px;
    }

    .ico {
        grid-column: 1;
        grid-row: 1;
        width: 40px;
        height: 40px;
    }

    .lbl {
        grid-column: 2;
        grid-row: 1;
        min-width: 0;
    }

    .lbl b {
        font-size: 17px;
    }

    .lbl span {
        font-size: 11px;
        white-space: normal;
    }

    .pct {
        grid-column: 3;
        grid-row: 1;
        font-size: 20px;
    }

    .pct small {
        font-size: 10px;
    }

    .track {
        grid-column: 1 / -1;
        grid-row: 2;
        height: 18px;
    }

    hr {
        margin: 18px 0 16px;
    }

    .age {
        gap: 10px;
        align-items: flex-start;
        padding-bottom: 6px;
    }

    .av {
        width: 42px;
        height: 42px;
    }

    .age .v {
        font-size: clamp(17px, 4.5vw, 22px);
        line-height: 1.3;
        overflow-wrap: break-word;
    }

    .age small {
        font-size: 12px;
    }

    .age .t {
        font-size: 10px;
    }

    .script {
        display: none;
    }
}

@media (max-width: 350px) {

    .card {
        padding: 18px 12px;
    }

    h1 {
        font-size: 26px;
    }

    .row {
        padding: 10px;
        column-gap: 8px;
    }

    .pct {
        font-size: 18px;
    }

    .age .v {
        font-size: 17px;
    }
}

</style>
</head>

<body>

<main class="card">

    <svg class="plants" id="p1" viewBox="0 0 300 250"></svg>
    <svg class="plants" id="p2" viewBox="0 0 190 120"></svg>

    <div class="inner">

        <h1>Time Progress</h1>
        <div class="date" id="date"></div>

        <!-- DAY -->

        <div class="row">

            <div class="ico" style="background:#fdf0dc">
                <svg viewBox="0 0 32 32">
                    <circle cx="16" cy="16" r="7" fill="#ffb12b"/>
                    <g stroke="#f7a31c" stroke-width="2.2" stroke-linecap="round">
                        <path d="M16 2v4 M16 26v4 M2 16h4 M26 16h4
                                 M6 6l3 3 M23 23l3 3
                                 M26 6l-3 3 M9 23l-3 3"/>
                    </g>
                </svg>
            </div>

            <div class="lbl">
                <b>Day</b>
                <span id="dayL"></span>
            </div>

            <div class="track">
                <div class="fill" id="dayB"
                     style="background:linear-gradient(90deg,#f8718a,#fa9c6a 50%,#fbc94a)">
                </div>
            </div>

            <div class="pct" id="dayP"></div>

        </div>

        <!-- MONTH -->

        <div class="row">

            <div class="ico" style="background:#dff3ea">
                <svg viewBox="0 0 32 32">
                    <rect x="4" y="6" width="24" height="22" rx="4" fill="#2f9c78"/>
                    <path d="M4 12h24" stroke="#dff3ea" stroke-width="2"/>
                    <g stroke="#2f9c78" stroke-width="2.5" stroke-linecap="round">
                        <path d="M10 3v5 M22 3v5"/>
                    </g>
                    <g fill="#dff3ea">
                        <rect x="9" y="16" width="4" height="4" rx="1"/>
                        <rect x="16" y="16" width="4" height="4" rx="1"/>
                        <rect x="9" y="22" width="4" height="4" rx="1"/>
                        <rect x="16" y="22" width="4" height="4" rx="1"/>
                    </g>
                </svg>
            </div>

            <div class="lbl">
                <b>Month</b>
                <span id="monL"></span>
            </div>

            <div class="track">
                <div class="fill" id="monB"
                     style="background:linear-gradient(90deg,#2aa593,#58dc8b 55%,#38c8e2)">
                </div>
            </div>

            <div class="pct" id="monP"></div>

        </div>

        <!-- YEAR -->

        <div class="row">

            <div class="ico" style="background:#ece6fb">
                <svg viewBox="0 0 32 32">
                    <path d="M16 2
                             C17 9 22 14 30 16
                             C22 18 17 23 16 30
                             C15 23 10 18 2 16
                             C10 14 15 9 16 2Z"
                          fill="#9258f3"/>
                </svg>
            </div>

            <div class="lbl">
                <b>Year</b>
                <span id="yrL"></span>
            </div>

            <div class="track">
                <div class="fill" id="yrB"
                     style="background:linear-gradient(90deg,#a63df0,#8a7bf5 55%,#66b6fb)">
                </div>
            </div>

            <div class="pct" id="yrP"></div>

        </div>

        <hr>

        <!-- AGE -->

        <div class="age">

            <div class="av">
                <svg width="30" height="30"
                     viewBox="0 0 32 32"
                     fill="none"
                     stroke="#2c2f3a"
                     stroke-width="2.2"
                     stroke-linecap="round">
                    <circle cx="16" cy="10.5" r="6"/>
                    <path d="M4.5 28
                             C5.3 21.8 10.1 18.5 16 18.5
                             S26.7 21.8 27.5 28"/>
                </svg>
            </div>

            <div class="age-content">
                <small>Your Age</small>
                <div class="v" id="age"></div>
                <div class="t" id="ageT"></div>
            </div>

        </div>

    </div>

    <div class="script">
        <span>Time</span>
        <span>in Motion</span>
    </div>

</main>

<script>

/* ==========================================
   CONFIGURATION
   ========================================== */

const BIRTH = new Date(1994, 1, 17);

/* ==========================================
   HELPERS
   ========================================== */

const $ = id => document.getElementById(id);

const p2 = n => String(n).padStart(2, '0');

/* ==========================================
   BOTANICAL ILLUSTRATIONS
   ========================================== */

let seed = 7;

const rnd = () =>
    (seed = (seed * 16807) % 2147483647) / 2147483647;

const cols = [
    '#6f8b62',
    '#7d9a6d',
    '#5f7d56',
    '#8aa77b',
    '#4f6b49'
];

function leaf(x, y, a, s, c) {

    const w = s * .36;

    return `
    <g transform="translate(${x} ${y}) rotate(${a})">
        <path
            d="M0 0
               C${s*.2} ${-w*1.15}
                ${s*.55} ${-w*.55}
                ${s} 0
               C${s*.55} ${w*.55}
                ${s*.2} ${w*1.15}
                0 0Z"
            fill="${c}"
            opacity=".93"
        />
        <path
            d="M0 0 L${s*.92} 0"
            stroke="#fff"
            stroke-opacity=".35"
            stroke-width=".8"
        />
    </g>`;
}

function branch(x0, y0, cx, cy, x1, y1, n, size) {

    let output = `
        <path
            d="M${x0} ${y0} Q${cx} ${cy} ${x1} ${y1}"
            fill="none"
            stroke="#7a6a4f"
            stroke-width="1.6"
            stroke-linecap="round"
        />
    `;

    for (let i = 1; i <= n; i++) {

        const t = i / (n + 1);

        const x =
            (1-t)*(1-t)*x0 +
            2*t*(1-t)*cx +
            t*t*x1;

        const y =
            (1-t)*(1-t)*y0 +
            2*t*(1-t)*cy +
            t*t*y1;

        const dx =
            2*(1-t)*(cx-x0) +
            2*t*(x1-cx);

        const dy =
            2*(1-t)*(cy-y0) +
            2*t*(y1-cy);

        const angle =
            Math.atan2(dy, dx) * 180 / Math.PI;

        const side = i % 2 ? 1 : -1;

        const scale =
            size * (1-t*.35) * (.8+rnd()*.4);

        output += leaf(
            x,
            y,
            angle + side*(40+rnd()*30),
            scale,
            cols[i%5]
        );
    }

    return output;
}

$('p1').innerHTML =
    branch(300,20,200,10,70,110,9,64) +
    branch(280,0,250,60,200,150,6,56) +
    branch(300,90,260,100,190,40,6,52);

$('p2').innerHTML =
    branch(150,118,100,100,28,42,4,32) +
    branch(125,116,98,82,78,24,3,28);

/* ==========================================
   AGE CALCULATION
   ========================================== */

function calculateAge(now, birth) {

    let years = now.getFullYear() - birth.getFullYear();
    let months = now.getMonth() - birth.getMonth();
    let days = now.getDate() - birth.getDate();

    if (days < 0) {
        months--;
        days += new Date(
            now.getFullYear(),
            now.getMonth(),
            0
        ).getDate();
    }

    if (months < 0) {
        years--;
        months += 12;
    }

    return [years, months, days];
}

/* ==========================================
   PROGRESS BARS
   ========================================== */

function updateBar(id, percentage) {

    const value = Math.max(0, Math.min(100, percentage));

    $(id + 'B').style.width = value.toFixed(3) + '%';

    const parts = value.toFixed(2).split('.');

    $(id + 'P').innerHTML =
        parts[0] +
        '<small>.' + parts[1] + '%</small>';
}

/* ==========================================
   LIVE UPDATE
   ========================================== */

function tick() {

    const now = new Date();

    const year = now.getFullYear();
    const month = now.getMonth();
    const day = now.getDate();

    const startOfDay = new Date(year, month, day);
    const startOfTomorrow = new Date(year, month, day + 1);

    const dayProgress =
        (now - startOfDay) /
        (startOfTomorrow - startOfDay) * 100;

    const hours = Math.floor(
        (now - startOfDay) / 3600000
    );

    const minutes = Math.floor(
        ((now - startOfDay) % 3600000) / 60000
    );

    const daysInMonth =
        new Date(year, month + 1, 0).getDate();

    const startOfMonth =
        new Date(year, month, 1);

    const startOfNextMonth =
        new Date(year, month + 1, 1);

    const monthProgress =
        (now - startOfMonth) /
        (startOfNextMonth - startOfMonth) * 100;

    const startOfYear =
        new Date(year, 0, 1);

    const startOfNextYear =
        new Date(year + 1, 0, 1);

    const yearProgress =
        (now - startOfYear) /
        (startOfNextYear - startOfYear) * 100;

    const daysInYear = Math.round(
        (startOfNextYear - startOfYear) / 86400000
    );

    const dayOfYear =
        Math.round(
            (startOfDay - startOfYear) / 86400000
        ) + 1;

    $('date').textContent =
        now.toLocaleDateString('en-US', {
            month: 'long',
            day: 'numeric',
            year: 'numeric'
        });

    $('dayL').textContent =
        `${hours}h ${minutes}m / 24h`;

    $('monL').textContent =
        `${day} / ${daysInMonth} days`;

    $('yrL').textContent =
        `${dayOfYear} / ${daysInYear} days`;

    updateBar('day', dayProgress);
    updateBar('mon', monthProgress);
    updateBar('yr', yearProgress);

    const [years, months, days] =
        calculateAge(now, BIRTH);

    const plural = (value, word) =>
        `${value} ${word}${value === 1 ? '' : 's'}`;

    $('age').textContent =
        `${plural(years,'year')}, ` +
        `${plural(months,'month')}, ` +
        `${plural(days,'day')}`;

    $('ageT').textContent =
        `+ ${p2(now.getHours())}h ` +
        `${p2(now.getMinutes())}m ` +
        `${p2(now.getSeconds())}s`;
}

tick();

setInterval(tick, 1000);

</script>

</body>
</html>
