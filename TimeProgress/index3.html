<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Time Progress</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@400;500;600&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
:root{--page:#e9e8e4;--card1:#fbfaf7;--card2:#efede8;--ink:#14182e;--sub:#5d6068;--track:#e6e5e2;--row:rgba(255,255,255,.82);--shadow:0 6px 18px rgba(60,55,40,.10);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#1c1d1f}}
:root[data-theme="dark"]{--page:#1c1d1f}
html,body{margin:0;min-height:100%}
body{background:var(--page);display:flex;align-items:center;justify-content:center;padding:20px;font-family:'DM Sans',system-ui,sans-serif;color:var(--ink)}
.card{position:relative;width:100%;max-width:620px;border-radius:22px;overflow:hidden;background:radial-gradient(120% 90% at 30% 0%,var(--card1),var(--card2));box-shadow:0 20px 50px rgba(0,0,0,.22),0 2px 6px rgba(0,0,0,.08);padding:30px 28px 26px}
svg.plants{position:absolute;pointer-events:none}
#p1{top:0;right:0;width:335px;height:279px}
#p2{bottom:-8px;right:112px;width:165px;height:104px}
.inner{position:relative;z-index:2}
h1{font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:clamp(34px,7vw,44px);margin:0;letter-spacing:.2px}
.date{margin:10px 0 22px 4px;font-size:13px;letter-spacing:.2em;color:#3b3e4a;text-transform:uppercase}
.row{display:grid;grid-template-columns:44px 100px 1fr 62px;align-items:center;gap:12px;background:var(--row);border-radius:20px;padding:12px 14px;margin-bottom:12px;box-shadow:var(--shadow);backdrop-filter:blur(6px)}
.ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.ico svg{width:26px;height:26px}
.lbl b{display:block;font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:17px;color:#1d2033}
.lbl span{font-size:12.5px;color:var(--sub);white-space:nowrap}
.track{height:20px;border-radius:10px;background:var(--track);overflow:hidden}
.fill{height:100%;width:0;border-radius:10px}
.pct{text-align:right;font-weight:600;font-size:20px}
.pct small{font-size:11px;font-weight:500;color:#8a8d95}
hr{border:0;border-top:1px solid #cfcdc7;margin:18px 4px 16px}
.age{display:flex;align-items:center;gap:16px;padding-left:2px;padding-bottom:8px}.age>div:last-child{position:relative}
.av{width:54px;height:54px;border-radius:50%;background:#dfe0d6;display:grid;place-items:center;flex:none}
.age small{display:block;font-size:14px;line-height:1;color:#3b3e4a;margin-top:6px}
.age .v{font-family:'Playfair Display',Georgia,serif;font-size:clamp(19px,4.4vw,25px);line-height:1.1;margin-top:5px}
.age .t{position:absolute;top:100%;left:0;white-space:nowrap;font-size:11.5px;color:#8a8d95;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.script{position:absolute;right:30px;bottom:34px;z-index:2;font-family:'Mrs Saint Delafield','Snell Roundhand',cursive;font-size:36px;line-height:.9;color:#5e6b82;transform:rotate(-6deg);text-align:left}
.script span{display:block}.script span+span{margin-left:30px}
@media (max-width:520px){.row{grid-template-columns:38px 78px 1fr 52px;gap:8px;padding:10px}.pct{font-size:16px}.script{display:none}}
</style>
</head>
<body>
<main class="card">
<svg class="plants" id="p1" viewBox="0 0 300 250"></svg>
<svg class="plants" id="p2" viewBox="0 0 190 120"></svg>
<div class="inner">
<h1>Time Progress</h1>
<div class="date" id="date"></div>

<div class="row">
 <div class="ico" style="background:#fdf0dc"><svg viewBox="0 0 32 32"><defs><radialGradient id="sg"><stop offset="0" stop-color="#ffc247"/><stop offset="1" stop-color="#f58b1f"/></radialGradient></defs><g stroke="#f7a31c" stroke-width="2.2" stroke-linecap="round"><path d="M16 2.5v3M16 26.5v3M2.5 16h3M26.5 16h3M6.5 6.5l2.1 2.1M23.4 23.4l2.1 2.1M25.5 6.5l-2.1 2.1M8.6 23.4l-2.1 2.1"/></g><circle cx="16" cy="16" r="7" fill="url(#sg)"/></svg></div>
 <div class="lbl"><b>Day</b><span id="dayL"></span></div>
 <div class="track"><div class="fill" id="dayB" style="background:linear-gradient(90deg,#f8718a,#fa9c6a 50%,#fbc94a)"></div></div>
 <div class="pct" id="dayP"></div>
</div>

<div class="row">
 <div class="ico" style="background:#dff3ea"><svg viewBox="0 0 32 32"><rect x="4" y="6" width="24" height="22" rx="4" fill="#2f9c78"/><path d="M4 12h24" stroke="#dff3ea" stroke-width="1.6"/><g stroke="#2f9c78" stroke-width="2.4" stroke-linecap="round"><path d="M10 3.5v5M22 3.5v5"/></g><g fill="#dff3ea"><rect x="8.5" y="15" width="3.6" height="3.6" rx=".9"/><rect x="14.2" y="15" width="3.6" height="3.6" rx=".9"/><rect x="19.9" y="15" width="3.6" height="3.6" rx=".9"/><rect x="8.5" y="21" width="3.6" height="3.6" rx=".9"/><rect x="14.2" y="21" width="3.6" height="3.6" rx=".9"/></g></svg></div>
 <div class="lbl"><b>Month</b><span id="monL"></span></div>
 <div class="track"><div class="fill" id="monB" style="background:linear-gradient(90deg,#2aa593,#58dc8b 55%,#38c8e2)"></div></div>
 <div class="pct" id="monP"></div>
</div>

<div class="row">
 <div class="ico" style="background:#ece6fb"><svg viewBox="0 0 32 32"><defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9b5cf6"/><stop offset="1" stop-color="#6d4fe6"/></linearGradient></defs><path d="M16 2.5c1.2 7.2 4.6 11.4 13 13.5-8.4 2.1-11.8 6.3-13 13.5C14.8 22.3 11.4 18.1 3 16c8.4-2.1 11.8-6.3 13-13.5z" fill="url(#pg)"/></svg></div>
 <div class="lbl"><b>Year</b><span id="yrL"></span></div>
 <div class="track"><div class="fill" id="yrB" style="background:linear-gradient(90deg,#a63df0,#8a7bf5 55%,#66b6fb)"></div></div>
 <div class="pct" id="yrP"></div>
</div>

<hr>
<div class="age">
 <div class="av"><svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke="#2c2f3a" stroke-width="2.2" stroke-linecap="round"><circle cx="16" cy="10.5" r="6"/><path d="M4.5 28c.8-6.2 5.6-9.5 11.5-9.5S26.700 21.800 27.500 28"/></svg></div>
 <div><small>Your Age</small><div class="v" id="age"></div><div class="t" id="ageT"></div></div>
</div>
</div>
<div class="script"><span>Time</span><span>in Motion</span></div>
</main>

<script>
const BIRTH=new Date(1994,1,17,0,0,0); // Feb 17, 1994 (matches the reference: 30y 8m 10d on Oct 27, 2024)
const $=id=>document.getElementById(id), p2=n=>String(n).padStart(2,'0');

/* ---------- foliage ---------- */
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const cols=['#6f8b62','#7d9a6d','#5f7d56','#8aa77b','#4f6b49'];
function leaf(x,y,a,s,c){const w=s*.36;return `<g transform="translate(${x} ${y}) rotate(${a})"><path d="M0 0C${s*.2} ${-w*1.15} ${s*.55} ${-w*.55} ${s} 0C${s*.55} ${w*.55} ${s*.2} ${w*1.15} 0 0Z" fill="${c}" opacity=".93"/><path d="M0 0L${s*.92} 0" stroke="#fff" stroke-opacity=".35" stroke-width=".8"/></g>`}
function branch(x0,y0,cx,cy,x1,y1,n,size){let o=`<path d="M${x0} ${y0}Q${cx} ${cy} ${x1} ${y1}" fill="none" stroke="#7a6a4f" stroke-width="1.6" stroke-linecap="round"/>`;
 for(let i=1;i<=n;i++){const t=i/(n+1),x=(1-t)*(1-t)*x0+2*t*(1-t)*cx+t*t*x1,y=(1-t)*(1-t)*y0+2*t*(1-t)*cy+t*t*y1;
 const dx=2*(1-t)*(cx-x0)+2*t*(x1-cx),dy=2*(1-t)*(cy-y0)+2*t*(y1-cy),b=Math.atan2(dy,dx)*180/Math.PI,side=i%2?1:-1,s=size*(1-t*.35)*(.8+rnd()*.4);
 o+=leaf(x,y,b+side*(40+rnd()*30),s,cols[i%5]);}
 const b=Math.atan2(y1-cy,x1-cx)*180/Math.PI;return o+leaf(x1,y1,b,size*.8,cols[0]);}
$('p1').innerHTML=branch(300,20,200,10,70,110,9,64)+branch(280,0,250,60,200,150,6,56)+branch(300,90,260,100,190,40,6,52)+branch(300,150,270,130,235,200,4,44);
$('p2').innerHTML=branch(150,118,100,100,28,42,4,32)+branch(125,116,98,82,78,24,3,28);

/* ---------- live clock ---------- */
const sub=(a,b)=>{let y=a.getFullYear()-b.getFullYear(),m=a.getMonth()-b.getMonth(),d=a.getDate()-b.getDate();
 if(d<0){m--;d+=new Date(a.getFullYear(),a.getMonth(),0).getDate()} if(m<0){y--;m+=12} return [y,m,d]};
const bar=(b,p,l)=>{$(b+'B').style.width=p.toFixed(3)+'%';const s=p.toFixed(2).split('.');$(b+'P').innerHTML=s[0]+'<small>.'+s[1]+'%</small>'};
function tick(){
 const n=new Date(),Y=n.getFullYear(),M=n.getMonth(),D=n.getDate();
 const sod=new Date(Y,M,D),dayMs=n-sod,dayP=dayMs/864e5*100;
 const h=Math.floor(dayMs/36e5),m=Math.floor(dayMs%36e5/6e4);
 const dim=new Date(Y,M+1,0).getDate(),monP=((n-new Date(Y,M,1))/(new Date(Y,M+1,1)-new Date(Y,M,1)))*100;
 const y0=new Date(Y,0,1),y1=new Date(Y+1,0,1),diy=Math.round((y1-y0)/864e5),doy=Math.round((sod-y0)/864e5)+1,yrP=(n-y0)/(y1-y0)*100;
 $('date').textContent=n.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
 $('dayL').textContent=`${h}h ${m}m / 24h`;$('monL').textContent=`${D} / ${dim} days`;$('yrL').textContent=`${doy} / ${diy} days`;
 bar('day',dayP);bar('mon',monP);bar('yr',yrP);
 const [ay,am,ad]=sub(n,BIRTH),pl=(v,w)=>v+' '+w+(v===1?'':'s');
 $('age').textContent=`${pl(ay,'year')}, ${pl(am,'month')}, ${pl(ad,'day')}`;
 $('ageT').textContent=`+ ${p2(n.getHours())}h ${p2(n.getMinutes())}m ${p2(n.getSeconds())}s`;
}
tick();setInterval(tick,250);
</script>
</body>
</html>
